<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakhi Das | UI/UX Designer</title>
<meta name="description" content="Portfolio of Rakhi Das, a UI/UX Designer based in Kolkata, India specializing in usability testing, heuristic evaluation, and intuitive product design.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body class="intro-active">

<a class="skip-link" href="#main">Skip to main content</a>

<!-- ===================== INTRO SPLASH =====================
     Giant centered brand name + portrait, held until the visitor's
     first pointer move (or ~1.4s), then morphed into the navbar logo
     and hero photo. Purely decorative — hidden from assistive tech
     and removed from the DOM flow once the morph completes (see
     initHeroMorph in script.js). -->
<div class="intro-overlay" id="introOverlay" aria-hidden="true">
  <div class="intro-brand-layer">
    <span class="intro-brand" id="introBrand"></span>
  </div>
  <div class="intro-portrait-layer">
    <div class="intro-portrait" id="introPortrait">
      <img src="" alt="" id="introPortraitImg" draggable="false">
    </div>
  </div>
</div>

<header class="site-header" id="siteHeader">
  <nav class="navbar" aria-label="Primary navigation">
    <ul class="nav-group nav-group-left" id="navLeft"></ul>

    <a href="#home" class="logo" id="logo"></a>

    <ul class="nav-group nav-group-right" id="navRight"></ul>

    <button class="nav-toggle" id="navToggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navMenuMobile">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
  </nav>

  <ul class="nav-menu-mobile" id="navMenuMobile"></ul>
</header>

<main id="main">

  <!-- ===================== HERO ===================== -->
  <section id="home" class="hero">
    <div class="container hero-inner">
      <div class="hero-text">
        <p class="hero-badge" id="heroBadge"></p>
        <p class="hero-headline" id="heroHeadline"></p>

        <div class="hero-cta">
          <a href="#" class="btn btn-primary" id="heroCtaPrimary">
            <span></span>
            <svg viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M0 5h12M7 1l5 4-5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <a href="#" class="btn btn-outline" id="heroCtaSecondary">
            <span></span>
            <svg viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M0 5h12M7 1l5 4-5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </div>

      <div class="hero-photo-wrap" id="heroPhotoWrap">
        <div class="hero-photo">
          <img src="" alt="" id="heroPhoto">
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== MY WORKS ===================== -->
  <section id="works" class="works">
    <div class="container">
      <p class="eyebrow-rule" id="worksEyebrow"></p>

      <div class="works-head">
        <p class="works-heading" id="worksHeading"></p>
        <a href="#" class="btn btn-primary" id="worksCta">
          <span></span>
          <svg viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M0 5h12M7 1l5 4-5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>

      <div class="works-list" id="worksList"></div>
    </div>
  </section>

  <!-- ===================== TESTIMONIALS ===================== -->
  <section id="testimonials" class="testimonials">
    <div class="container">
      <p class="eyebrow-rule" id="testimonialsEyebrow"></p>

      <div class="testimonials-head">
        <p class="testimonials-heading" id="testimonialsHeading"></p>
        <div class="carousel-nav">
          <button type="button" class="carousel-arrow" id="testimonialsPrev" aria-label="Previous testimonial">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="carousel-arrow" id="testimonialsNext" aria-label="Next testimonial">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="testimonials-track" id="testimonialsTrack"></div>
    </div>
  </section>

  <!-- ===================== MY GALLERY ===================== -->
  <section id="gallery" class="gallery">
    <div class="container">
      <p class="eyebrow-rule" id="galleryEyebrow"></p>

      <div class="gallery-head">
        <p class="gallery-heading" id="galleryHeading"></p>
        <p class="gallery-paragraph" id="galleryParagraph"></p>
      </div>

      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="footer">
  <div class="container footer-inner">
    <p class="footer-watermark" id="footerWatermark" aria-hidden="true"></p>

    <div class="footer-intro">
      <div class="footer-avatar">
        <img src="" alt="" id="footerAvatar">
      </div>
      <div class="footer-intro-text">
        <p class="footer-heading" id="footerHeading"></p>
        <p class="footer-tagline" id="footerTagline"></p>
      </div>
    </div>

    <div class="footer-actions">
      <a href="#" class="btn btn-dark" id="footerEmail">
        <span></span>
        <svg viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M0 5h12M7 1l5 4-5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a href="#" class="btn btn-outline-light" id="footerCv">
        <span>Download CV</span>
        <svg viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M0 5h12M7 1l5 4-5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <ul class="footer-social" id="footerSocialList"></ul>

    <div class="footer-bottom">
      <p id="footerCopyright"></p>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
