<!-- Theme, replayed before first paint. This has to run here — inline and
     ahead of the stylesheet's first use — or a returning dark-mode visitor
     gets a white flash while script.js is still loading. Light is the
     default: `prefers-color-scheme` is deliberately not consulted, so the
     portfolio opens the same way for everyone and dark stays a choice. -->
<script>
  (function () {
    try {
      if (window.localStorage.getItem('rakhi:theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (err) {
      /* Storage blocked or private mode — light is the default anyway. */
    }
  })();
</script>

<!-- All page copy is rendered from data.js by script.js. Real crawlers and
     browsers run JS and see the full page; this is only for the rare
     no-JS visitor / scraper, so it isn't kept in sync field-by-field. -->

<!-- ===================== INTRO SPLASH =====================
     Giant centered brand name + portrait, held until the visitor's
     first pointer move (or ~1.4s), then morphed into the navbar logo
     and hero photo. Purely decorative — hidden from assistive tech
     and removed from the DOM flow once the morph completes (see
     initHeroMorph in script.js). -->
<div class="intro-overlay" id="introOverlay" aria-hidden="true">
  <div class="intro-brand-layer">
    <span class="intro-brand" id="introBrand"></span>
  </div>
  <div class="intro-portrait-layer">
    <div class="intro-portrait" id="introPortrait">
      <img src="" alt="" id="introPortraitImg" width="472" height="769" fetchpriority="high" draggable="false">
    </div>
  </div>
</div>

<header class="site-header" id="siteHeader">

    <button class="nav-toggle" id="navToggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navMenuMobile">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
  </nav>

  <!-- Sits beside the bar rather than inside it, so the nav keeps its
       centred logo between two equal link groups. Both glyphs are always
       present and crossfade; the button's aria-label carries the state. -->
  <button class="theme-toggle glass" id="themeToggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20.4 14.3A8.6 8.6 0 0 1 9.7 3.6a8.6 8.6 0 1 0 10.7 10.7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <ul class="nav-menu-mobile glass" id="navMenuMobile"></ul>
</header>
